<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO METADATA -->
  <title>Pythos | The AI Mathematical Oracle by LANZAR</title>
  <meta name="description" content="Pythos is an AI-powered mathematical oracle and tutor built by LANZAR. Explore algebra, geometry, and calculus through Socratic guidance and ancient wisdom.">
  <meta name="author" content="Jon Scott / LANZAR">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pythos.lanzar.me/">

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="Pythos | The AI Mathematical Oracle by LANZAR">
  <meta property="og:description" content="Pythos is an AI-powered mathematical oracle and tutor built by LANZAR. Master mathematics through Socratic guidance.">
  <meta property="og:url" content="https://pythos.lanzar.me/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://pythos.lanzar.me/assets/pythos_avatar.jpg">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Pythos",
    "applicationCategory": "EducationalApplication",
    "description": "An AI-powered mathematical oracle and tutor that uses Socratic methods to teach math.",
    "operatingSystem": "Web",
    "developer": {
      "@type": "Organization",
      "name": "LANZAR",
      "url": "https://lanzar.me"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-color: #fcfbf9; /* Soft marble */
      --surface-color: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary-color: #2a728f; /* Aegean/Retro Teal */
      --primary-hover: #1e5a73;
      --accent-orange: #f46b45; /* Fire orange */
      --chat-ai-bg: #f1f5f9;
      --chat-user-bg: #e0f2fe;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      /* Math & Shapes SVG Background */
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232a728f' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M10 10l10-10h10L20 10v10H10V10zm20 30h10v10H30V40zm20-10h10v10H50V30zm30 50h10v10H80V80zm-20 20h10v10H60v-10z'/%3E%3Ccircle cx='90' cy='20' r='5'/%3E%3Ccircle cx='30' cy='80' r='8'/%3E%3Cpolygon points='50,90 60,105 40,105'/%3E%3Ctext x='70' y='60' font-family='monospace' font-size='14' font-weight='bold'%3E%2B%3C/text%3E%3Ctext x='15' y='50' font-family='monospace' font-size='12'%3E%3D%3C/text%3E%3Ctext x='100' y='95' font-family='serif' font-size='16' font-style='italic'%3E%26%23x3C0%3B%3C/text%3E%3Ctext x='10' y='110' font-family='serif' font-size='14' font-style='italic'%3Ex%3C/text%3E%3C/g%3E%3C/svg%3E");
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 90vh;
        max-height: 850px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }
    }

    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
      border-radius: 12px 12px 0 0;
    }

    .header-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-image: url('assets/pythos_avatar.jpg');
      background-size: cover;
      background-position: center;
      border: 2px solid var(--accent-orange);
      box-shadow: 0 0 10px rgba(244, 107, 69, 0.3);
    }

    .header-info h1 {
      margin: 0;
      font-family: 'Cinzel', serif; /* Greek style font */
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    .header-info p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Polyglot Footer */
    .polyglot-footer {
      background: var(--surface-color);
      padding: 10px 24px 16px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
    
    .polyglot-footer span {
      display: inline-block;
      margin-top: 4px;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    #output {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 14px 20px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 1rem;
      position: relative;
    }

    /* AI Message */
    .message.assistant {
      background: var(--chat-ai-bg);
      color: var(--text-main);
      align-self: flex-start;
      border-left: 4px solid var(--primary-color);
    }

    /* User Message */
    .message.user {
      background: var(--chat-user-bg);
      color: var(--text-main);
      align-self: flex-end;
      border-right: 4px solid var(--accent-orange);
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
      background: transparent !important;
      border: none !important;
      padding: 0 20px !important;
    }

    .input-area {
      padding: 20px 24px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      background: var(--bg-color);
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(42, 114, 143, 0.1);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      color: var(--text-main);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      background: var(--primary-color);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.95);
    }

    .send-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="header-avatar"></div>
      <div class="header-info">
        <h1>PYTHOS</h1>
        <p>Mathematics & Physics Oracle</p>
      </div>
    </div>

    <div id="output"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input id="userInput" type="text" placeholder="Speak to the Oracle..." autocomplete="off" />
        <button id="submitBtn" aria-label="Send">
          <svg class="send-icon" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="polyglot-footer">
      Fluent in 100+ Languages. Just type in your native tongue!<br>
      <span>🇺🇸 🇲🇽 🇫🇷 🇩🇪 🇯🇵 🇨🇳 🇰🇷 🇮🇹 🇮🇳 🇧🇷</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
