<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO METADATA -->
  <title>Pythos | The AI Mathematical Oracle by LANZAR</title>
  <meta name="description" content="Pythos is an AI-powered mathematical oracle and tutor built by LANZAR. Explore algebra, geometry, and calculus through Socratic guidance and ancient wisdom.">
  <meta name="author" content="Jon Scott / LANZAR">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pythos.lanzar.me/">

  <!-- OPEN GRAPH -->
  <meta property="og:title" content="Pythos | The AI Mathematical Oracle by LANZAR">
  <meta property="og:description" content="Pythos is an AI-powered mathematical oracle and tutor built by LANZAR. Master mathematics through Socratic guidance.">
  <meta property="og:url" content="https://pythos.lanzar.me/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://pythos.lanzar.me/assets/pythos_avatar.jpg">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Pythos",
    "applicationCategory": "EducationalApplication",
    "description": "An AI-powered mathematical oracle and tutor that uses Socratic methods to teach math.",
    "operatingSystem": "Web",
    "developer": {
      "@type": "Organization",
      "name": "LANZAR",
      "url": "https://lanzar.me"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-color: #fcfbf9; /* Soft marble */
      --surface-color: #ffffff;
      --sidebar-bg: #1e293b; /* Dark sidebar for contrast */
      --sidebar-hover: #334155;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-light: #f8fafc;
      --primary-color: #2a728f; /* Aegean/Retro Teal */
      --primary-hover: #1e5a73;
      --accent-orange: #f46b45; /* Fire orange */
      --chat-ai-bg: #f1f5f9;
      --chat-user-bg: #e0f2fe;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Layout */
    .layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        z-index: 1000;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }

    .sidebar-header {
      padding: 16px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: var(--sidebar-hover);
      color: white;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .login-btn, .logout-btn {
      width: 100%;
      padding: 10px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .login-btn:hover { background: var(--primary-hover); }
    .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); margin-top: 10px; }
    .logout-btn:hover { background: rgba(255,0,0,0.1); }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .user-profile img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    /* Main Chat Area */
    .main-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Hand-drawn Math Doodle Background */
      background-image: linear-gradient(rgba(252, 251, 249, 0.92), rgba(252, 251, 249, 0.92)), url('assets/math_bg.jpg');
      background-size: 500px;
      background-repeat: repeat;
      position: relative;
    }

    .mobile-menu-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 90vh;
        max-height: 850px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }
    }

    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
    }

    @media (max-width: 768px) {
      .header { padding-left: 60px; } /* Room for mobile menu btn */
    }

    .header-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-image: url('assets/pythos_avatar.jpg');
      background-size: cover;
      background-position: center;
      border: 2px solid var(--accent-orange);
      box-shadow: 0 0 10px rgba(244, 107, 69, 0.3);
    }

    .header-info h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    .header-info p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #output {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 14px 20px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 1rem;
      position: relative;
    }

    .message.assistant {
      background: var(--chat-ai-bg);
      color: var(--text-main);
      align-self: flex-start;
      border-left: 4px solid var(--primary-color);
    }

    .message.user {
      background: var(--chat-user-bg);
      color: var(--text-main);
      align-self: flex-end;
      border-right: 4px solid var(--accent-orange);
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
      background: transparent !important;
      border: none !important;
      padding: 0 20px !important;
    }

    .input-area {
      padding: 20px 24px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      background: var(--bg-color);
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(42, 114, 143, 0.1);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      color: var(--text-main);
    }

    button.send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.send-btn:hover { background: var(--primary-hover); }
    button.send-btn:active { transform: scale(0.95); }

    .send-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .polyglot-footer {
      background: var(--surface-color);
      padding: 10px 24px 16px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
    
    .polyglot-footer span {
      display: inline-block;
      margin-top: 4px;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

  </style>
</head>
<body>

  <div class="layout">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="newChatBtn" class="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Chat
        </button>
      </div>
      
      <div id="chatHistoryList" class="chat-history">
        <!-- Chat history items will be injected here via JS -->
      </div>
      
      <div class="sidebar-footer">
        <button id="loginBtn" class="login-btn">Login with Google</button>
        <div id="userInfo" style="display: none;" class="user-profile">
          <img id="userAvatar" src="" alt="Avatar" />
          <div style="flex:1; overflow:hidden;">
            <div id="userName" style="font-weight:600; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;"></div>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <div class="main-area">
      <button id="mobileMenuBtn" class="mobile-menu-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="app-container">
        <div class="header">
          <div class="header-avatar"></div>
          <div class="header-info">
            <h1>PYTHOS</h1>
            <p>Mathematics & Physics Oracle</p>
          </div>
        </div>

        <div id="output"></div>

        <div class="input-area">
          <div class="input-wrapper">
            <input id="userInput" type="text" placeholder="Speak to the Oracle..." autocomplete="off" />
            <button id="submitBtn" class="send-btn" aria-label="Send">
              <svg class="send-icon" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
        
        <div class="polyglot-footer">
          Fluent in 100+ Languages. Just type in your native tongue!<br>
          <span>🇺🇸 🇲🇽 🇫🇷 🇩🇪 🇯🇵 🇨🇳 🇰🇷 🇮🇹 🇮🇳 🇧🇷</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
