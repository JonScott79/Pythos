<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pythos | The AI Oracle</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-color: #fcfbf9; /* Soft marble */
      --surface-color: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary-color: #2a728f; /* Aegean/Retro Teal */
      --primary-hover: #1e5a73;
      --accent-orange: #f46b45; /* Fire orange */
      --chat-ai-bg: #f1f5f9;
      --chat-user-bg: #e0f2fe;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 90vh;
        max-height: 850px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }
    }

    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
      border-radius: 12px 12px 0 0;
    }

    .header-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-image: url('assets/pythos_avatar.jpg');
      background-size: cover;
      background-position: center;
      border: 2px solid var(--accent-orange);
      box-shadow: 0 0 10px rgba(244, 107, 69, 0.3);
    }

    .header-info h1 {
      margin: 0;
      font-family: 'Cinzel', serif; /* Greek style font */
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    .header-info p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #output {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 14px 20px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 1rem;
      position: relative;
    }

    /* AI Message */
    .message.assistant {
      background: var(--chat-ai-bg);
      color: var(--text-main);
      align-self: flex-start;
      border-left: 4px solid var(--primary-color);
    }

    /* User Message */
    .message.user {
      background: var(--chat-user-bg);
      color: var(--text-main);
      align-self: flex-end;
      border-right: 4px solid var(--accent-orange);
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
      background: transparent !important;
      border: none !important;
      padding: 0 20px !important;
    }

    .input-area {
      padding: 20px 24px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      border-radius: 0 0 12px 12px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      background: var(--bg-color);
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(42, 114, 143, 0.1);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      color: var(--text-main);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      background: var(--primary-color);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.95);
    }

    .send-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="header-avatar"></div>
      <div class="header-info">
        <h1>PYTHOS</h1>
        <p>Mathematical Oracle</p>
      </div>
    </div>

    <div id="output"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input id="userInput" type="text" placeholder="Speak to the Oracle..." autocomplete="off" />
        <button id="submitBtn" aria-label="Send">
          <svg class="send-icon" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
